<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pa lidhje — UNPOROSIS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141210">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
  :root{--ink:#141210;--muted:#6b6357;--orange:#ff7a1a;--orange2:#ffb03a;--line:#e6e2db;--paper:#f6f4f1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 90% at 50% 0%, #fff 0%, var(--paper) 55%, #efeae2 100%);
    color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:22px;
    padding:38px 30px;text-align:center;box-shadow:0 18px 48px rgba(20,18,16,.10)}
  .icon{width:64px;height:64px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--orange2),var(--orange));color:#1a0d02}
  .icon svg{width:32px;height:32px}
  .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;
    color:#a35a12;background:#fff3e2;border:1px solid #f2d9b8;padding:5px 12px;border-radius:999px;margin-bottom:14px}
  h1{margin:0 0 10px;font-size:clamp(22px,4vw,28px);letter-spacing:-.02em}
  p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.65}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;text-decoration:none;
    padding:12px 22px;border-radius:999px;transition:transform .15s ease}
  a.btn:hover{transform:translateY(-1px)}
  a.primary{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#1a0d02}
  a.ghost{border:1px solid var(--line);color:var(--ink);background:#fff}
  .hint{margin-top:22px;font-size:12.5px;color:#9a9287}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 14 0"/><path d="M2 9.4a15 15 0 0 1 20 0"/>
      </svg>
    </div>
    <span class="tag">Pa lidhje</span>
    <h1>Nuk ka internet për momentin.</h1>
    <p>Faqja është ruajtur në pajisjen tënde, por statusi i pakove kërkon lidhje. Provo përsëri ose shkruaj në WhatsApp.</p>
    <div class="btns">
      <a class="btn primary" href="/">Provo përsëri</a>
      <a class="btn ghost" href="https://wa.me/38343863688" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <p class="hint">043 863 688 · unporosis@gmail.com</p>
  </div>
</body>
</html>
